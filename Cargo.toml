[package]
name = "tubesAPI"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
axum = "0.8.7"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "2.8.2"
bcrypt = "0.17.1"
hyper = "1.8.1"
async-trait = "0.1"
futures-util = "0.3.31"
dotenv = "0.15.0"
log = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
