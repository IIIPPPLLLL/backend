[package]
name = "tubesAPI"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "3.1.0"
chrono = "0.4.42"
bcrypt = "0.17.1"
